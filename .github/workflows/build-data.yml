name: Build district data

# Regenerates docs/data/* from source. Runs on a GitHub-hosted runner, which
# has unrestricted network access -- so this is where you can switch the
# pipeline to higher-fidelity sources (Census TIGER tracts + VEST precinct
# results) that are blocked in sandboxed dev environments.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Download sources
        working-directory: pipeline
        run: python download.py
      - name: Build scenarios
        working-directory: pipeline
        run: python build.py
      - name: Run tests
        run: python tests/test_apportion.py
      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Rebuild district data"
          git push
